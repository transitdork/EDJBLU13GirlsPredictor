  .sel-num { color: #94a3b8; font-size: 14px; }
  .sel-rating { font-size: 12px; color: #64748b; font-family: system-ui, sans-serif; }

function winProb(d){ return Math.round(100/(1+Math.exp(-Math.abs(d)/12))); }
function conf(d){
  if(d<5)  return {label:'Coin flip',        col:'#94a3b8'};
  if(d<15) return {label:'Slight edge',      col:'#f59e0b'};
  if(d<30) return {label:'Clear favourite',  col:'#f97316'};
  if(d<50) return {label:'Strong favourite', col:'#ef4444'};
  return          {label:'Heavy favourite',  col:'#dc2626'};
}
function gradeInfo(team){
  const gt = TEAMS.filter(t=>t.grade===team.grade).sort((a,b)=>b.rating-a.rating);
  const gr = gt.findIndex(t=>t.name===team.name)+1;
  const all = [...TEAMS].sort((a,b)=>(GO[a.grade]-GO[b.grade])||(b.rating-a.rating));
  return {gr, or: all.findIndex(t=>t.name===team.name)+1, gt: gt.length};
}

/* ── History panel ── */
function renderFormPanel(side, team){
  const panel = document.getElementById('form-'+side);
  if(!team){ panel.className='form-panel'; return; }

  const entries = HISTORY[team.name] || [];
  const col = GC[team.grade];

  let rows = '';
  if(!entries.length){
    rows = '<div style="color:#475569;font-size:13px;font-family:system-ui,sans-serif;padding:8px 0">No game history available</div>';
  } else {
    entries.forEach(e => {
      const resCls = 'res-'+(e.res||'Bye');
      const resLbl = e.res==='Bye' ? 'BYE' : e.res;

      // Score display
      let scoreHTML = '';
      if(e.res==='Bye'){
        scoreHTML = '<span style="color:#475569">Bye week</span>';
      } else if(e.sf!=null && e.sa!=null){
        const mCol = e.m>0?'#34d399':e.m<0?'#f87171':'#94a3b8';
        scoreHTML = `<span class="score-exact">${e.sf}–${e.sa}</span> <span style="color:${mCol};font-weight:600">(${e.m>0?'+':''}${e.m})</span>`;
      } else {
        const mCol = e.m>0?'score-pos':e.m<0?'score-neg':'score-zero';
        scoreHTML = `<span class="${mCol};font-weight:600">${e.m>0?'+':''}${e.m} pts</span>`;
      }

      // Opponent short name
      const oppShort = e.opp ? e.opp.replace(' U13 Girls ',' G') : '—';
      const oppFull  = e.opp || 'Bye';

      rows += `<div class="form-game">
        <span class="form-round-badge" style="background:${GB[e.g]};color:${GC[e.g]};border:1px solid ${GC[e.g]}44">R${e.r} ${e.g}</span>
        <div class="form-result-dot ${resCls}">${resLbl}</div>
        <div class="form-detail">
          <div class="form-opp" title="${oppFull}">${oppFull}</div>
          <div class="form-score">${scoreHTML}</div>
        </div>
      </div>`;
    });
  }

  panel.innerHTML = `<div class="form-panel-title" style="color:${col}">${team.club} Girls ${team.num} — Form</div>${rows}`;
  panel.className = 'form-panel visible';
}

/* ── Selector box ── */
function renderBox(side){
  const team = side==='a'?selA:selB;
  const info = document.getElementById('sel-'+side+'-info');
  const box  = document.getElementById('box-'+side);
  if(!team){
    info.innerHTML='<span class="sel-placeholder">Select a team…</span>';
    box.style.background='rgba(255,255,255,0.03)';
    box.style.borderColor='rgba(255,255,255,0.1)';
    return;
  }
  const col=GC[team.grade];
  box.style.background=GB[team.grade]; box.style.borderColor=col;
  const r3b = team.r3!==team.grade
    ?`<span class="grade-badge" style="background:${GC[team.r3]};opacity:.85">R3: ${team.r3} ${team.r3<team.grade?'↑':'↓'}</span>`:'';
  const rc = team.rating>=0?'#34d399':'#f87171';
  info.innerHTML=`<div class="sel-badges">
    <span class="grade-badge" style="background:${col}">R2: ${team.grade}</span>${r3b}
    <span class="sel-club">${team.club}</span>
    <span class="sel-num">Girls ${team.num}</span>
  </div>
  <div class="sel-rating">Massey rating: <span style="color:${rc};font-weight:600">${rStr(team.rating)}</span></div>`;
}

/* ── Dropdown ── */
function buildList(side){
  const exclude = side==='a'?selB:selA;
  const q = document.getElementById('search-'+side).value.toLowerCase();
  const current = side==='a'?selA:selB;
  const filtered = TEAMS.filter(t=>(!exclude||t.name!==exclude.name)&&t.name.toLowerCase().includes(q));
  const grouped={A:[],B:[],C:[],D:[]};
  filtered.forEach(t=>grouped[t.grade].push(t));
  let html='';
  ['A','B','C','D'].forEach(g=>{
    if(!grouped[g].length) return;
    html+=`<div class="grade-header" style="color:${GC[g]};background:${GB[g]}">${g} Grade — ${grouped[g].length} teams</div>`;
    grouped[g].forEach(t=>{
      const isSel=current&&current.name===t.name;
      const rc=t.rating>=0?'#34d399':'#f87171';
      const our=t.club==='Collingwood'?'<span class="our-tag">OUR CLUB</span>':'';
      html+=`<div class="team-option${isSel?' sel':''}" style="${isSel?`border-left-color:${GC[g]}`:''}" onclick="selectTeam('${side}','${t.name}')">
        <div><span class="team-option-name">${t.club}</span><span class="team-option-num">Girls ${t.num}</span>${our}</div>
        <span class="team-option-rating" style="color:${rc}">${rStr(t.rating)}</span>
      </div>`;
    });
  });
  document.getElementById('list-'+side).innerHTML = html||'<div style="padding:16px;text-align:center;color:#475569;font-family:system-ui,sans-serif;font-size:13px">No teams found</div>';
}

function toggleDropdown(side){
  const other=side==='a'?'b':'a';
  document.getElementById('drop-'+other).classList.remove('open');
  document.getElementById('box-'+other).classList.remove('open');
  const open=document.getElementById('drop-'+side).classList.toggle('open');
  document.getElementById('box-'+side).classList.toggle('open',open);
  if(open){ buildList(side); setTimeout(()=>document.getElementById('search-'+side).focus(),50); }
}
function filterList(side){ buildList(side); }

function selectTeam(side,name){
  const team=TEAMS.find(t=>t.name===name);
  if(side==='a') selA=team; else selB=team;
  document.getElementById('drop-'+side).classList.remove('open');
  document.getElementById('box-'+side).classList.remove('open');
  document.getElementById('search-'+side).value='';
  renderBox(side);
  renderFormPanel(side, team);
  renderResult();
}

/* ── Result card ── */
function teamCard(team){
  const {gr,or,gt}=gradeInfo(team);
  const col=GC[team.grade]; const rc=team.rating>=0?'#34d399':'#f87171';
  const r3cls=team.r3<team.grade?'r3-up':team.r3>team.grade?'r3-down':'r3-same';
  const r3arrow=team.r3<team.grade?' ↑':team.r3>team.grade?' ↓':'';
  return `<div class="team-stat-card" style="background:${GB[team.grade]};border:1px solid ${col}44">
    <div class="rank-bubble" style="background:${col}">${team.grade}</div>
    <div class="team-card-name">${team.club} <span class="team-card-num">Girls ${team.num}</span></div>
    <div class="r3-row">
      <span class="r3-current">R2: ${team.grade}</span><span class="r3-arrow">→</span>
      <span class="${r3cls}">R3 forecast: ${team.r3}${r3arrow}</span>
    </div>
    <div class="stat-line"><span class="stat-line-label">Massey rating</span><span class="stat-line-val" style="color:${rc}">${rStr(team.rating)}</span></div>
    <div class="stat-line"><span class="stat-line-label">R2 grade rank</span><span class="stat-line-val">${gr} / ${gt}</span></div>
    <div class="stat-line"><span class="stat-line-label">Overall rank</span><span class="stat-line-val">${or} / 131</span></div>
  </div>`;
}

function renderResult(){
  const area=document.getElementById('result-area');
  if(!selA||!selB){
    area.innerHTML=`<div class="empty-state">${!selA&&!selB?'Select two teams above to generate a match prediction':'Select Team '+(selA?'B':'A')+' to see the prediction'}</div>`;
    return;
  }
  const tA=selA, tB=selB;
  const diff=tA.rating-tB.rating, margin=Math.round(Math.abs(diff));
  const winner=diff>0?tA:diff<0?tB:null;
  const c=conf(Math.abs(diff)), wp=winProb(diff);
  const aW=diff>0?wp:100-wp, bW=100-aW;
  const colA=GC[tA.grade], colB=GC[tB.grade];

  const resultHTML = margin===0
    ? `<div class="result-big"><div class="result-label">Predicted result</div><div class="margin-big" style="color:#94a3b8">Draw</div><div class="margin-label">Ratings are identical — too close to call</div></div>`
    : `<div class="result-big">
        <div class="result-label">Predicted winner</div>
        <div class="winner-name" style="color:${GC[winner.grade]}">${winner.club} <span class="winner-num">Girls ${winner.num}</span></div>
        <div class="margin-big">+${margin}</div>
        <div class="margin-label">estimated point margin</div>
        <div><span class="conf-badge" style="color:${c.col};background:${c.col}18;border:1px solid ${c.col}44">${c.label}</span></div>
      </div>`;

  const barHTML = margin>0 ? `<div class="prob-bar-wrap">
    <div class="prob-labels">
      <span style="color:${aW>bW?'#f1f5f9':'#475569'}">${tA.club} ${aW}%</span>
      <span style="color:${bW>aW?'#f1f5f9':'#475569'}">${bW}% ${tB.club}</span>
    </div>
    <div class="prob-bar">
      <div class="prob-seg" style="width:${aW}%;background:linear-gradient(90deg,${colA},${colA}cc);border-radius:7px 0 0 7px"></div>
      <div class="prob-seg" style="width:${bW}%;background:linear-gradient(90deg,${colB}cc,${colB});border-radius:0 7px 7px 0"></div>
    </div>
  </div>` : '';

  const crossHTML = tA.grade!==tB.grade
    ? `<div class="cross-grade-warn">⚠️ <strong>Cross-grade matchup</strong> — these teams played in different grades in Round 2 (${tA.grade} vs ${tB.grade}). The Massey system can still estimate a margin, but treat this with more caution than a same-grade prediction.</div>` : '';

  area.innerHTML=`<div class="card">
    ${resultHTML}${barHTML}
    <div class="stats-row">
      <div class="stat-box"><div class="stat-value" style="color:${diff>0?colA:'#64748b'}">${aW}%</div><div class="stat-label">${tA.club} win prob.</div></div>
      <div class="stat-box"><div class="stat-value">${margin}</div><div class="stat-label">Predicted margin</div></div>
      <div class="stat-box"><div class="stat-value" style="color:${diff<0?colB:'#64748b'}">${bW}%</div><div class="stat-label">${tB.club} win prob.</div></div>
    </div>
    <div class="team-compare-row">${teamCard(tA)}${teamCard(tB)}</div>
    ${crossHTML}
    <div class="disclaimer"><strong>How this works:</strong> The Massey rating system solves a simultaneous equation across all 130 games in Rounds 1 &amp; 2. It chains results — a win over a team that then beats strong opponents is worth more than a win over a weak team. The predicted margin is the raw rating difference. Win probability uses a logistic curve (±12 pts ≈ 70/30). Based on 2 rounds of data only — confidence improves each week.</div>
  </div>`;
}

document.addEventListener('click', e=>{
  ['a','b'].forEach(s=>{
    if(!document.getElementById('wrap-'+s).contains(e.target)){
      document.getElementById('drop-'+s).classList.remove('open');
      document.getElementById('box-'+s).classList.remove('open');
    }
  });
});
</script>
</body>
</html>
